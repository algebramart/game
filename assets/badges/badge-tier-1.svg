<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="t1-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="t1-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="t1-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="t1-star" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="t1-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#451a03" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#t1-shadow)">
    <!-- Pita Bawah -->
    <polygon points="36,74 24,110 40,101 48,113 54,78" fill="url(#t1-ribbon)"/>
    <polygon points="84,74 96,110 80,101 72,113 66,78" fill="url(#t1-ribbon)"/>
    <!-- Perisai Segi Delapan Perunggu -->
    <polygon points="60,10 85,18 98,42 92,69 60,86 28,69 22,42 35,18" fill="url(#t1-outer)" stroke="#fef3c7" stroke-width="2.5"/>
    <circle cx="60" cy="48" r="27" fill="url(#t1-inner)" stroke="#fbbf24" stroke-width="2"/>
    <!-- Bintang Utama Tier 1 -->
    <polygon points="60,27 66,40 80,42 70,52 72,66 60,59 48,66 50,52 40,42 54,40" fill="url(#t1-star)"/>
    <!-- Kilau -->
    <circle cx="45" cy="30" r="3" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>

