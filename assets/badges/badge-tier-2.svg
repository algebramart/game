<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="t2-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="t2-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="t2-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="t2-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="t2-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#t2-shadow)">
    <!-- Sayap Samping Perak -->
    <path d="M22,48 L6,36 L14,54 L8,64 L26,64 Z" fill="url(#t2-silver)" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M98,48 L114,36 L106,54 L112,64 L94,64 Z" fill="url(#t2-silver)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Pita Bawah -->
    <polygon points="38,76 26,111 42,102 49,113 55,78" fill="url(#t2-ribbon)"/>
    <polygon points="82,76 94,111 78,102 71,113 65,78" fill="url(#t2-ribbon)"/>
    <!-- Perisai Perak -->
    <path d="M60,8 L94,22 L94,56 C94,75 60,92 60,92 C60,92 26,75 26,56 L26,22 Z" fill="url(#t2-silver)" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M60,16 L86,27 L86,54 C86,69 60,83 60,83 C60,83 34,69 34,54 L34,27 Z" fill="url(#t2-core)" stroke="#93c5fd" stroke-width="1.5"/>
    <!-- Bintang Utama & 2 Bintang Kecil -->
    <polygon points="60,28 66,41 80,43 70,53 72,67 60,60 48,67 50,53 40,43 54,41" fill="url(#t2-gold)"/>
    <circle cx="45" cy="28" r="2.5" fill="#ffffff" opacity="0.75"/>
  </g>
</svg>

